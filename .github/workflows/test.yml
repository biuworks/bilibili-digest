name: tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # 这个名字会成为 PR 上的状态检查名，分支保护按它匹配，别随手改
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          # 零依赖项目，没有 lockfile，自动缓存无从谈起
          package-manager-cache: false

      # 测试只用 Node 自带的 node:test，不需要 npm install
      - run: npm test
